<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E2A019"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Arılık Saha">
<style>html,body{margin:0;padding:0}</style>
<title>Arılık Saha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: masaüstünde solda menü + içerik; telefonda üstte menü şeridi. Kovanlar altıgen durum simgeli kompakt kutucuklar, ayrıntılar alt panel/pencerelerde. */
:root{
  --bg:#EEF1EA; --surface:#FBFCF8; --surface2:#E3E9DF; --ink:#18241C; --muted:#5A6B5E; --line:#CDD7C9; --line2:#B9C5B4;
  --accent:#E2A019; --on-accent:#1E1404; --focus:#1F6A38;
  --green:#2E8A4B; --orange:#E07B12; --red:#CF3B2E; --gold:#C9A227; --yellow:#F5C518; --gray:#9AA39B; --gray-l:#C3CAC2;
  --ice:#5AAFDC; --ice-d:#2A7DAA; --ice-bg:#E2F2FA;
  --green-t:#1F6A38; --orange-t:#A3540A; --red-t:#A82A1F;
  --honey:#D98E04; --brood:#B0715A; --pollen:#A4A11F; --bloom:#7FA62B; --dew:#A9742B;
  --shadow:0 8px 28px rgba(20,30,22,.18);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101612; --surface:#18211B; --surface2:#222D25; --ink:#E4ECE2; --muted:#9BAA9E; --line:#2D3A31; --line2:#3B4A40;
    --accent:#E8AE33; --on-accent:#1E1404; --focus:#7FD99B;
    --green:#3FA25F; --orange:#E8892A; --red:#E0574A; --gold:#D6B23E; --yellow:#F2C730; --gray:#7D8A80; --gray-l:#4A564D;
    --ice:#78C3EA; --ice-d:#A9DDF7; --ice-bg:#17303D;
    --green-t:#7FD99B; --orange-t:#F2AE68; --red-t:#F2958A;
    --honey:#E8A21A; --brood:#CC8D74; --pollen:#C7C43A; --bloom:#9BC24A; --dew:#C8934A;
    --shadow:0 8px 28px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#18211B; --surface2:#222D25; --ink:#E4ECE2; --muted:#9BAA9E; --line:#2D3A31; --line2:#3B4A40;
  --accent:#E8AE33; --on-accent:#1E1404; --focus:#7FD99B;
  --green:#3FA25F; --orange:#E8892A; --red:#E0574A; --gold:#D6B23E; --yellow:#F2C730; --gray:#7D8A80; --gray-l:#4A564D;
  --ice:#78C3EA; --ice-d:#A9DDF7; --ice-bg:#17303D;
  --green-t:#7FD99B; --orange-t:#F2AE68; --red-t:#F2958A;
  --honey:#E8A21A; --brood:#CC8D74; --pollen:#C7C43A; --bloom:#9BC24A; --dew:#C8934A;
  --shadow:0 8px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num,td.n,.money{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:20px 14px 20px max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:default}
.brand.can{cursor:pointer}
.brand .logo{flex:0 0 auto;width:46px;height:46px;display:grid;place-items:center}
.brand .logo img{max-width:46px;max-height:46px;object-fit:contain}
.brand .logo svg{width:40px;height:40px}
.brand b{display:block;font:700 19px/1.1 var(--f-display)}
.brand small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:10px;min-height:42px;padding:8px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600}
.nav a svg{width:20px;height:20px;color:var(--muted);flex:0 0 auto}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current=page]{background:var(--ink);color:var(--bg)}
.nav a[aria-current=page] svg{color:var(--accent)}
.side .role{margin-top:auto;font-size:12.5px;color:var(--muted);padding:0 4px}
.main{min-width:0;padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
.topbar{display:none}
@media (max-width:899px){
  .shell{display:block}
  .side{display:none}
  .topbar{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surface);border-bottom:1px solid var(--line);padding-top:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .brand .logo{width:34px;height:34px}.topbar .brand .logo img{max-width:34px;max-height:34px}.topbar .brand .logo svg{width:30px;height:30px}
  .topbar .brand b{font-size:17px}
  .topbar .nav{flex-direction:row;overflow-x:auto;gap:2px;margin-top:6px;scrollbar-width:none}
  .topbar .nav::-webkit-scrollbar{display:none}
  .topbar .nav a{flex:0 0 auto;min-height:40px;padding:6px 10px;border-radius:9px 9px 0 0;font-size:14px}
  .topbar .nav a[aria-current=page]{background:var(--bg);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
  .main{padding-block:16px 64px}
}

/* ---------- common ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:28px;line-height:1.1;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--muted);font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:8px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--red-t);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13.5px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line2);background:var(--surface);cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.sec{margin-top:22px}
.sec>h2{font-size:19px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec>h2 small{font:500 13px var(--f-body);color:var(--muted)}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.t-demirbas{background:color-mix(in srgb,#5E7CC4 18%,transparent);color:#3E5FA8}
.chip.t-sarf{background:color-mix(in srgb,var(--honey) 20%,transparent);color:var(--orange-t)}
.chip.t-analiz{background:color-mix(in srgb,#8A5CC0 18%,transparent);color:#7444AA}
.chip.t-iscilik{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green-t)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.t-demirbas{color:#9DB4EA}:root:not([data-theme="light"]) .chip.t-analiz{color:#C4A4EA}}
:root[data-theme="dark"] .chip.t-demirbas{color:#9DB4EA}:root[data-theme="dark"] .chip.t-analiz{color:#C4A4EA}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:14px}
.empty b{display:block;color:var(--ink);font:700 17px var(--f-display);margin-bottom:4px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;border-radius:10px;background:var(--surface2);font-size:13.5px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface2);white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
.filters label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.filters select,.filters input{min-height:38px;padding:6px 10px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-size:14px;color:var(--ink);max-width:100%}
.filters input{min-width:150px}

/* ---------- masraf ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:0}
.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kpi b{display:block;font:700 19px/1.2 var(--f-display);font-variant-numeric:tabular-nums;margin-top:3px;overflow-wrap:anywhere}
.kpi.total{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.kpi.total span{color:var(--bg);opacity:.75}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi.total{grid-column:1/-1}}
.debt{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
@media (max-width:760px){.debt{grid-template-columns:1fr}}
.pairs{display:grid;gap:8px;align-content:start}
.pair{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.pair .who{flex:1;min-width:0;font-weight:600}
.pair .who small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.pair .arrow{color:var(--muted)}
.pair b{font:700 17px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--green-t)}.neg{color:var(--red-t)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.p-erman{background:#D98E04}.p-ozcan{background:#3E7CC4}.p-bora{background:#8A5CC0}
.pv td{white-space:nowrap}
.pv .lvl0 td{font-weight:700;background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.pv .lvl1 td:first-child{padding-left:30px}
.pv .lvl2 td:first-child{padding-left:56px;white-space:normal}
.pv .lvl1 td{font-weight:600}
.pv .tog{width:22px;height:22px;display:inline-grid;place-items:center;border-radius:5px;border:1px solid var(--line2);background:var(--surface);margin-right:8px;cursor:pointer;font-weight:700;line-height:1;font-size:15px;padding:0;vertical-align:middle}
.pv tfoot td{font-weight:700;background:var(--surface2);border-top:2px solid var(--line2)}
.rec{display:grid;gap:8px}
.rec-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.rec-row .t{font-weight:700;overflow-wrap:anywhere}
.rec-row .m{grid-column:1;display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.rec-row .a{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.rec-row .a b{font:700 16px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.rec-row .act{display:flex;gap:4px}
.mini{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.mini:hover{color:var(--ink);border-color:var(--line2)}
.mini svg{width:16px;height:16px}

/* ---------- kovan liste ---------- */
.kv-head{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin-bottom:12px}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cnt{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px}
.cnt b{font:700 16px var(--f-display);font-variant-numeric:tabular-nums}
.cnt .dot{width:11px;height:11px}
.d-green{background:var(--green)}.d-orange{background:var(--orange)}.d-red{background:var(--red)}.d-gray{background:var(--gray-l);border:1px solid var(--gray)}.d-ice{background:var(--ice)}
.sbar{display:flex;gap:10px;align-items:stretch;margin-bottom:16px}
.sfilters{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:560px}
.fbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:60px;padding:6px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.fbtn .fn{font:700 23px/1 var(--f-display);font-variant-numeric:tabular-nums}
.fbtn .fbl{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.fbtn[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fbtn[aria-pressed=true] .fbl{color:var(--bg);opacity:.85}
.fbtn .ms{width:14px;height:14px}
.health{margin-left:auto;flex:0 0 auto;min-width:118px;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:7px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line2)}
.health .hl{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.health .hv{font:700 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.health .hm{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.health .hm i{display:block;height:100%;background:var(--green);border-radius:2px}
.health .hs{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:520px){.sbar{flex-wrap:wrap}.sfilters{flex-basis:100%;max-width:none}.health{margin-left:0;flex-direction:row;align-items:center;flex-wrap:wrap;gap:4px 12px;width:100%}.health .hm{flex:1 1 100px}}
.apiary-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.apiary{display:flex;flex-direction:column;gap:10px;width:max-content}
.ap-front{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-left:34px}
.stand{display:grid;grid-template-columns:26px repeat(7,134px);gap:6px;align-items:stretch;padding:6px 6px 6px 0;border-radius:14px;background:color-mix(in srgb,var(--line) 35%,transparent);position:relative}
.stand.short{grid-template-columns:26px repeat(3,134px);width:max-content}
.stand.extra{background:none;border:1px dashed var(--line)}
.st-lb{align-self:center;justify-self:center;font-size:12px;font-weight:700;color:var(--muted)}
.stand .stage{zoom:.72}
.stand .vrow{zoom:.78;margin-top:2px}
.stand .tile{padding:4px 2px 7px;border-radius:12px}
.stand .tile .no{font-size:15px}
.tile.ghost{background:transparent;border:1.5px dashed var(--line);opacity:.45;cursor:default}
.tile.ghost[role=button]{cursor:pointer}
.tile.ghost[role=button]:hover{opacity:.8;border-color:var(--accent)}
.tile.ghost .hive{filter:grayscale(1);opacity:.5}
.tile.dim{opacity:.3}
.desk-only{display:none}
@media (min-width:700px){
  .desk-only{display:inline-flex}
  .sbar .apt{align-self:center;white-space:nowrap}
  .ph{margin-bottom:10px}
  .ph h1{font-size:22px}
  .ph .btns .btn{min-height:34px;padding:5px 12px;font-size:13.5px}
  .ph .btns .btn svg{width:15px;height:15px}
  .ph p{font-size:12.5px}
  .counts{margin-bottom:8px;gap:5px}
  .cnt{padding:3px 10px;font-size:12.5px;gap:6px}
  .cnt b{font-size:13.5px}
  .cnt .dot{width:9px;height:9px}
  .sbar{margin-bottom:10px;align-items:center}
  .sfilters{max-width:440px}
  .fbtn{flex-direction:row;gap:6px;min-height:34px;padding:4px 8px;border-radius:10px}
  .fbtn .fn{font-size:16px}
  .fbtn .fbl{font-size:12px}
  .health{flex-direction:row;align-items:center;gap:8px;padding:5px 10px;min-width:0}
  .health .hv{font-size:16px}
  .health .hm{width:60px}
}
.apiary.compact{flex-direction:row;align-items:flex-start;gap:8px}
.apiary.compact .stand{grid-template-columns:74px;grid-template-rows:20px repeat(7,44px);gap:5px;padding:0 4px 4px;border-radius:10px}
.apiary.compact .stand.short{grid-template-columns:74px;grid-template-rows:20px repeat(3,44px);width:auto}
.apiary.compact .stand.extra{grid-template-rows:20px}
.apiary.compact .st-lb{align-self:end}
.ct{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:9px;background:var(--surface);border:1px solid var(--line);cursor:pointer;user-select:none}
.ct:hover{border-color:var(--accent)}
.ct .ctn{font:700 15px var(--f-display);font-variant-numeric:tabular-nums}
.ct svg.hive{width:26px;height:30px}
.ct.rear{background:color-mix(in srgb,var(--gold) 14%,var(--surface));border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.ct .qbig{width:30px;height:30px}
.ct.winter{background:var(--ice-bg)}
.ct.ghost{background:transparent;border:1.5px dashed var(--line);opacity:.5;cursor:default}
.ct.ghost .ctn{color:var(--muted);font-size:13px}
.ct.ghost[role=button]{cursor:pointer}
.ct.ghost[role=button]:hover{opacity:.9;border-color:var(--accent)}
.ct.dim{opacity:.3}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px}
.hgrid .stage{zoom:.74}
.hgrid .vrow{zoom:.8;margin-top:2px}
.hgrid .tile{padding:4px 2px 7px;border-radius:13px}
.hgrid .tile .no{font-size:15px}
@media (max-width:420px){.hgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.hgrid .stage{zoom:.62}.hgrid .vrow{zoom:.66}.hgrid .tile .no{font-size:13px}.hgrid .tile .no small{font-size:9.5px}}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);cursor:pointer;min-width:0}
.tile:hover{border-color:var(--line2)}
.tile{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.tile.winter{background:var(--ice-bg);border-color:color-mix(in srgb,var(--ice) 55%,var(--line))}
.tile.rear{background:color-mix(in srgb,var(--gold) 12%,var(--surface));border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.rear-stage .hv-ico{left:8px!important;top:56px!important;transform:none!important}
.qbadge{display:inline-block;width:40px;height:43px;color:#2B2100}
.qbadge svg{width:100%;height:100%;display:block}
.qbadge path{fill:var(--gold);stroke:#fff;stroke-width:1.2}

.mvc.lost{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 4px,transparent 4px,transparent 8px);opacity:.6}
.wa-sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.wa-l{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:14px;padding:5px 0;border-bottom:1px dashed var(--line)}
.wa-l span{color:var(--muted);min-width:150px}
.wa-l small{color:var(--muted);font-size:12px}
.fl.trap.off{opacity:.65}
.chip.on{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green-t)}
.fl .ib em{font-style:normal;font-weight:600;color:var(--ink)}
.fl .ib em.late{color:var(--red)}
.wa-baits{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:12.5px;color:var(--muted);align-items:center}
.wa-baits span{padding:1px 8px;border-radius:99px;background:var(--surface2)}
.wa-baits i{font-style:normal}
.wa-cks{display:grid;gap:2px}
.wa-ck{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:13px;padding:4px 0;border-top:1px solid var(--line);min-width:0}
.wa-ck .lv{white-space:nowrap}
.wa-ck .d{font-variant-numeric:tabular-nums;color:var(--muted)}
.wa-ck .rf{font-size:11.5px;color:var(--green-t);font-weight:700}
.wa-ck .nt{flex-basis:100%;color:var(--muted);font-size:12.5px}
.wa-ck .act{display:flex;gap:2px;margin-left:auto}
.wa-cks,.fl.trap{min-width:0}
.wa-bar{display:inline-block;width:60px;height:7px;border-radius:4px;background:var(--line);overflow:hidden;vertical-align:middle;margin-right:7px}
.wa-bar i{display:block;height:100%;background:var(--red)}
.wa-bar i.sarica{background:var(--honey)}
.wa-bar i.tot{background:var(--ink)}
.f .lb .wa-dot{margin-right:4px}
.tl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.tl{min-width:760px;padding:10px 14px 12px}
.tl-row{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;min-height:30px}
.tl-row .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px;background:none;border:0;text-align:left;cursor:pointer;color:var(--ink)}
.tl-track{position:relative;height:30px}
.tl-head .tl-track{height:22px}
.tl-mon{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.tl-head .tl-mon span{position:absolute;left:4px;top:2px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tl-bar{position:absolute;top:8px;height:14px;border-radius:7px;background:var(--bloom);border:0;padding:0;cursor:pointer;min-width:6px}
.tl-bar.salgi{background:var(--dew)}
.tl-pt{position:absolute;top:8px;width:14px;height:14px;border-radius:50%;transform:translateX(-50%);background:var(--bloom);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--bloom);cursor:pointer;padding:0}
.tl-pt.salgi{background:var(--dew);box-shadow:0 0 0 1px var(--dew)}
.tl-today{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--orange);z-index:2}
.tl-today span{position:absolute;top:-1px;left:4px;font-size:10.5px;font-weight:700;color:var(--orange-t);white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:8px 2px 0}
.legend i{display:inline-block;width:18px;height:8px;border-radius:4px;margin-right:6px;vertical-align:middle}
.fl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.fl{padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;gap:8px;align-content:start}
.fl.hl{box-shadow:0 0 0 2px var(--accent)}
.fl h3{font-size:17px}
.fl .ib{font-size:13px;color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.thumbs button{padding:0;border:0;background:var(--surface2);border-radius:8px;overflow:hidden;aspect-ratio:1;cursor:zoom-in;max-width:100%}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.ph-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.ph-edit div{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surface2);max-width:100%}
.ph-edit img{width:100%;height:100%;object-fit:cover}
.ph-edit button{position:absolute;right:4px;top:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.lightbox{max-width:100%;max-height:72vh;display:block;margin:0 auto;border-radius:10px}
@media (prefers-reduced-motion: no-preference){.btn,.fbtn,.tile,.mini{transition:border-color .15s,background-color .15s}}
</style>

  function compress(file) {
    return new Promise(function (res) {
      if (!/^image\//.test(file.type) || file.type === 'image/gif' || file.type === 'image/svg+xml') return res(file);
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(function (b) { res(b && b.size < file.size ? b : file); }, 'image/jpeg', 0.84);
      };
      img.onerror = function () { URL.revokeObjectURL(url); res(file); };
      img.src = url;
    });
  }

    'hive-winter': function () { var y = clone(cur()); y.wintering = !y.wintering; S.menu = false; saveHive(y); toast(y.wintering ? 'Kışlatma modu açıldı' : 'Kışlatma modu kapandı'); },
    'hive-reset': function () { S.menu = false; render(); resetModal(cur()); },
    'hive-reset-yes': function () {
      var y = clone(cur()); ['checks', 'treatments', 'feedings', 'counts', 'queens', 'events'].forEach(function (k) { y[k] = []; }); y.wintering = false; delete y.example;
      closeModal(); S.tab = 'checks'; saveHive(y); toast('Kovan ' + y.no + ' sıfırlandı');
    },
    'hive-delete': function () {
      var x = cur(); $('#hdel').innerHTML = '<div class="confirm" style="margin-top:10px"><span>Kovan ' + esc(x.no) + ' ve bütün kayıtları kalıcı olarak silinecek. Bu işlem geri alınamaz.</span><div class="fbtns"><button class="btn danger" type="button" data-a="hive-delete-yes">Evet, kovanı sil</button></div></div>';
    },
    'hive-delete-yes': function () { var x = cur(); closeModal(); S.hiveId = null; del('hives', x.id); render(); toast('Kovan ' + x.no + ' silindi'); },
    'del-examples': function () { S.data.hives.filter(function (x) { return x.example; }).forEach(function (x) { del('hives', x.id); }); render(); toast('Örnek kovanlar silindi'); },
    'chk-add': function () { checkForm(cur()); }, 'chk-edit': function (el) { checkForm(cur(), findIn(cur(), 'checks', el.dataset.id)); },
    'chk-del': function (el) { var c = findIn(cur(), 'checks', el.dataset.id); hiveSubDel('checks', c.id, L.fmtD(c.date) + ' tarihli kontrol silinecek.', 'checks'); },
    'tr-add': function () { treatForm(cur()); }, 'tr-edit': function (el) { treatForm(cur(), findIn(cur(), 'treatments', el.dataset.id)); },
    'tr-del': function (el) { var t = findIn(cur(), 'treatments', el.dataset.id); hiveSubDel('treatments', t.id, '“' + esc(t.productName || '') + '” uygulaması ve takvimdeki adımları silinecek.', 'treat'); },
    'fd-add': function () { feedForm(cur()); }, 'fd-edit': function (el) { feedForm(cur(), findIn(cur(), 'feedings', el.dataset.id)); },
    'fd-del': function (el) { var f = findIn(cur(), 'feedings', el.dataset.id); hiveSubDel('feedings', f.id, L.fmtD(f.date) + ' tarihli besleme silinecek.', 'feed'); },
    'ct-add': function () { countForm(cur()); }, 'ct-edit': function (el) { countForm(cur(), findIn(cur(), 'counts', el.dataset.id)); },
    'ct-del': function (el) { var c = findIn(cur(), 'counts', el.dataset.id); hiveSubDel('counts', c.id, L.fmtD(c.date) + ' tarihli varroa sayımı silinecek.', 'count'); },
    'qn-add': function () { queenForm(cur()); }, 'qn-edit': function (el) { queenForm(cur(), findIn(cur(), 'queens', el.dataset.id)); },
    'qn-del': function (el) { var q = findIn(cur(), 'queens', el.dataset.id); hiveSubDel('queens', q.id, 'Doğum tarihi ' + L.fmtD(q.date) + ' olan ana arı kaydı silinecek.', 'queen'); },
    'dose-save': function (el) {
      var x = cur(), y = clone(x), t = findIn(y, 'treatments', el.dataset.t), i = Number(el.dataset.i), inp = document.getElementById('dz-' + el.dataset.t + '-' + i);
      t.steps[i].dose = inp.value.trim(); S.tab = 'treat'; saveHive(y); toast('Doz kaydedildi');
    },
    'mat-add': function () { matForm(); }, 'mat-list': matListModal, 'mat-edit': function (el) { matForm(get('materials', el.dataset.id)); },
    'mat-del': function (el) { var m = get('materials', el.dataset.id); confirmDel('“' + esc(matLabel(m)) + '” malzemesi listeden silinecek. Bu ürünle yapılmış geçmiş kayıtlar korunur.', function () { del('materials', m.id); toast('Malzeme silindi'); }); },
    'trap-add': function () { trapForm(); }, 'trap-edit': function (el) { trapForm(get('traps', el.dataset.id)); },
    'trap-del': function (el) { var t = get('traps', el.dataset.id); confirmDel('“' + esc(t.name) + '” ve tüm kontrol kayıtları silinecek.', function () { del('traps', t.id); toast('Tuzak silindi'); }); },
    'trap-bait': function (el) { baitForm(get('traps', el.dataset.id)); },
    'trap-end': function (el) { var y = clone(get('traps', el.dataset.id)); y.end = y.end ? null : T(); put('traps', y); render(); toast(y.end ? y.name + ' kaldırıldı' : y.name + ' yeniden kuruldu'); },
    'trc-add': function (el) { trapCheckForm(get('traps', el.dataset.id)); },
    'trc-edit': function (el) { var t = get('traps', el.dataset.id); trapCheckForm(t, (t.checks || []).find(function (c) { return c.id === el.dataset.c; })); },
    'trc-del': function (el) { var t = get('traps', el.dataset.id); confirmDel('Bu tuzak kontrolü silinecek.', function () { var y = clone(t); y.checks = (y.checks || []).filter(function (c) { return c.id !== el.dataset.c; }); put('traps', y); toast('Kontrol silindi'); }); },
    'wa-season': function (el) { if (S.editable) seasonForm(el.dataset.sp); },
    'wa-loss': function (el) { lossForm(el.dataset.sp); },
    'wa-loss-del': function (el) { var r = seasonOf(el.dataset.y, el.dataset.sp); if (!r) return; confirmDel('Bu söndürülen kovan kaydı silinecek.', function () { var y = clone(r); y.losses = (y.losses || []).filter(function (l) { return l.id !== el.dataset.id; }); put('wasps', y); toast('Kayıt silindi'); }); },
    'fl-add': function () { floraForm(); }, 'fl-edit': function (el) { floraForm(get('flora', el.dataset.id)); },
    'fl-del': function (el) { var r = get('flora', el.dataset.id); confirmDel('“' + esc(r.plant) + '” kaydı ve fotoğrafları silinecek.', function () { del('flora', r.id); if (S.assets) (r.photos || []).forEach(function (p) { S.assets.delete(p).catch(function () {}); }); toast('Kayıt silindi'); }); },
    'fl-show': function (el) { S.flHl = el.dataset.id; render(); setTimeout(function () { var c = document.getElementById('fl-' + el.dataset.id); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60); },
    'fl-photo': function (el) { openModal(el.dataset.cap || 'Fotoğraf', '<img class="lightbox" src="' + esc(el.dataset.src) + '" alt="' + esc(el.dataset.cap) + '">', { wide: true }); },
    logo: function () { $('#logo-file').click(); }
  };
  /* adım tamamlama (checkbox) */
  function stepToggle(el) {
    var hid = el.dataset.h || S.hiveId, x = hv(hid); if (!x || !S.editable) return;
    var y = clone(x), t = findIn(y, 'treatments', el.dataset.t), i = Number(el.dataset.i); if (!t) return;
    t.steps[i].done = el.checked; t.steps[i].doneAt = el.checked ? T() : null;
    put('hives', y); render(); toast(el.checked ? t.steps[i].label + ' tamamlandı' : t.steps[i].label + ' bekleyen işe döndü');
  }
  function repeatDone(el) {
    var x = hv(el.dataset.h); if (!x || !S.editable) return;
    var y = clone(x), t = findIn(y, 'treatments', el.dataset.t); if (!t) return;
    var today = T(), n = clone(t); n.id = uid('t'); n.start = today; n.season = L.seasonFor(today); var md = t.productId ? get('materials', t.productId) : null; n.steps = [{ day: 1, label: 'Uygulama', hasDose: true, date: today, done: true, doneAt: today, dose: (md && md.defaultDose) || (t.steps && t.steps[0] && t.steps[0].dose) || '' }]; n.note = ''; n.created = Date.now();
    y.treatments.push(n); put('hives', y); render(); toast((t.productName || 'Bitkisel ürün') + ' yeniden uygulandı; sonraki tekrar ' + L.fmtD(L.addDays(today, Number(t.repeatDays))));
  }

  /* dokunmatik: kovan kartında kısa dokunuş kovanı açar, simgeye basılı tutmak açıklamayı gösterir */
  var lpT = null, lpDone = false, lastPtr = 'mouse', lpX = 0, lpY = 0;
  document.addEventListener('pointerdown', function (e) {
    lastPtr = e.pointerType || 'mouse'; lpDone = false; clearTimeout(lpT);
    if (lastPtr === 'mouse') return;
    var tipEl2 = e.target.closest('.tile [data-tip]'); if (!tipEl2) return;
    lpX = e.clientX; lpY = e.clientY;
    lpT = setTimeout(function () { lpDone = true; showTip(tipEl2); if (navigator.vibrate) try { navigator.vibrate(15); } catch (x) {} }, 450);
  }, true);
  document.addEventListener('pointermove', function (e) { if (lpT && (Math.abs(e.clientX - lpX) > 10 || Math.abs(e.clientY - lpY) > 10)) { clearTimeout(lpT); lpT = null; } }, true);
  document.addEventListener('pointerup', function () { clearTimeout(lpT); lpT = null; }, true);
  document.addEventListener('pointercancel', function () { clearTimeout(lpT); lpT = null; }, true);
  document.addEventListener('contextmenu', function (e) { if (lastPtr !== 'mouse' && e.target.closest('.tile')) e.preventDefault(); });
  document.addEventListener('click', function (e) {
    if (lastPtr !== 'mouse' && e.target.closest('.tile')) {
      if (lpDone) { lpDone = false; e.preventDefault(); return; }
      hideTip(); openHive(e.target.closest('.tile').getAttribute('data-id')); return;
    }
    var na = e.target.closest('.nav a');
    if (na && na.getAttribute('href') === location.hash) { S.hiveId = null; S.menu = false; render(); return; }
    var hx = e.target.closest('[data-tip]');
    if (hx && !e.target.closest('[data-a]:not(.tile)') ) {
      e.stopPropagation(); e.preventDefault();
      if (tipFor === hx) hideTip(); else showTip(hx);
      return;
    }
    if (tipFor && !hx) hideTip();
    var el = e.target.closest('[data-a]'); if (!el) { if (S.menu && !e.target.closest('.menu-wrap')) { S.menu = false; render(); } return; }
    var a = el.getAttribute('data-a');
    if (a === 'step-done') { stepToggle(el); return; }
    if (a === 'repeat-done') { if (el.checked) repeatDone(el); return; }
    if (a === 'trap-done') { el.checked = false; var tq = get('traps', el.dataset.tr); if (tq && S.editable) trapCheckForm(tq); return; }
    if (a === 'rear-done') { var hr = hv(el.dataset.h); if (!hr || !S.editable || !hr.queenRearing) return; var yr = clone(hr), stp = (yr.queenRearing.steps || []).find(function (q) { return q.key === el.dataset.k; }); if (!stp) return; stp.done = el.checked; stp.doneAt = el.checked ? T() : null; put('hives', yr); render(); toast(el.checked ? stp.title + ' yapıldı' : stp.title + ' bekleyene döndü'); return; }
    if (a === 'todo-done') { var hx2 = hv(el.dataset.h); if (!hx2 || !S.editable) return; var y2 = clone(hx2), cc = findIn(y2, 'checks', el.dataset.c); if (!cc) return; cc.nextDone = el.checked; put('hives', y2); render(); toast(el.checked ? 'İş tamamlandı' : 'İş bekleyene döndü'); return; }
    if (A[a]) { if (el.tagName !== 'INPUT') e.preventDefault(); A[a](el, e); }
  });
  /* filtre alanları */
  document.addEventListener('input', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-f'); if (!k) return;
    var p = k.split('.'), obj = { pv: S.pvF, rec: S.recF, cal: S.calF, fl: S.flF, wa: S.waF }[p[0]]; obj[p[1]] = e.target.value;
    if (p[0] === 'rec') S.recN = 40; if (p[0] === 'fl') S.flHl = null;
    render();
  });
  $('#logo-file').addEventListener('change', function () {
    var f = this.files[0]; this.value = ''; if (!f || !S.assets) return;
    toast('Amblem yükleniyor…');
    S.assets.upload(f, { type: /^image\/(png|jpeg|webp|gif|svg\+xml)$/.test(f.type) ? f.type : 'image/png' }).then(function (r) {
      var st = clone(settings()); var old = st.logo; st.logo = r.id; put('settings', st); render(); toast('Amblem güncellendi');
      if (old && old !== r.id) S.assets.delete(old).catch(function () {});
    }).catch(function () { toast('Amblem yüklenemedi. PNG veya JPEG deneyin.'); });
  });

  /* =================================================================== */
  /*                              BAŞLANGIÇ                              */
  /* =================================================================== */
  if (SAHA) {
    S.mode = 'saha'; S.editable = true; COLS.forEach(function (c) { S.loaded[c] = true; });
    if (sahaLoad() && SZ.cur) SYNC_COLS.forEach(function (c) { S.data[c] = SZ.cur[c] || []; });
    else if (!/senkron/.test(location.hash)) location.hash = '#senkron';
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    route(); return;
  }
  route();
  (async function () {
    var cl = window.claude;
    if (!cl || !cl.use) { S.mode = 'memory'; S.editable = true; COLS.forEach(function (c) { S.loaded[c] = true; }); render(); return; }
    var db = null, user = null;
    try { db = await cl.use('db'); } catch (e) { db = null; }
    try { user = await cl.use('user'); } catch (e) { user = null; }
    if (user) {
      try {
        var cw = await user.can('data.write');
        if (cw === null) cw = (await user.canEdit()) || (await user.isOwner());
        S.editable = !!cw;
      } catch (e) { S.editable = false; }
    }
    if (S.editable) { try { S.assets = await cl.use('assets'); } catch (e) { S.assets = null; } try { S.downloads = await cl.use('downloads'); } catch (e) { S.downloads = null; } }
    if (!db) { S.mode = 'memory'; S.editable = !user; render(); return; }
    store = db;
    var pending = COLS.length;
    COLS.forEach(function (col) {
      db.collection(col).onSnapshot(function (snap) {
        S.data[col] = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; });
        if (!S.loaded[col]) { S.loaded[col] = true; pending--; }
        if (pending <= 0) S.mode = 'db';
        if (S.hiveId && !hv(S.hiveId)) S.hiveId = null;
        render();
      }, function () { if (!S.loaded[col]) { S.loaded[col] = true; pending--; } if (pending <= 0 && S.mode === 'loading') S.mode = 'db'; render(); });
    });
  })();
})();
</script>
